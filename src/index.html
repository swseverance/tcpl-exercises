<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The C Programming Language Exercises</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><text x='50' y='80' font-size='80' font-family='Arial Black, Helvetica Neue, Helvetica, sans-serif' font-weight='900' fill='%231857a4' text-anchor='middle'>C</text></svg>"
    />
  </head>
  <body>
    <script>
      const lightName = 'light';
      const lightClass = 'tcpl-exercises-light-theme';
      const lightStyle = document.querySelector('link[href^="light-theme"]');

      const darkName = 'dark';
      const darkClass = 'tcpl-exercises-dark-theme';
      const darkStyle = document.querySelector('link[href^="dark-theme"]');

      let theme = lightName;

      if (
        localStorage.getItem('theme') === darkName ||
        (!localStorage.getItem('theme') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        theme = darkName;
      }

      if (theme == lightName) {
        lightStyle.disabled = false;
        document.body.classList.add(lightClass);

        darkStyle.disabled = true;
        document.body.classList.remove(darkClass);
      } else {
        darkStyle.disabled = false;
        document.body.classList.add(darkClass);

        lightStyle.disabled = true;
        document.body.classList.remove(lightClass);
      }
    </script>
    <app-root></app-root>
  </body>
</html>
