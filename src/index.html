<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The C Programming Language Exercises</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><text x='50' y='80' font-size='80' font-family='Arial Black, Helvetica Neue, Helvetica, sans-serif' font-weight='900' fill='%231857a4' text-anchor='middle'>C</text></svg>"
    />
  </head>
  <body>
    <script>
      const LIGHT = 'light';
      const DARK = 'dark';

      const lightStyle = document.querySelector('link[href^="light-theme"]');
      const darkStyle = document.querySelector('link[href^="dark-theme"]');

      const THEMES = [
        { name: LIGHT, style: lightStyle },
        { name: DARK, style: darkStyle }
      ];

      var themeService = {
        theme: null,
        applyTheme: function (theme) {
          localStorage.setItem('theme', theme);

          this.theme = theme;

          for (const { name, style } of THEMES) {
            style.disabled = name !== theme;
          }
        },
        toggle: function () {
          this.applyTheme(this.theme === LIGHT ? DARK : LIGHT);
        }
      };

      let theme = LIGHT;

      if (
        localStorage.getItem('theme') === DARK ||
        (!localStorage.getItem('theme') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        theme = DARK;
      }

      themeService.applyTheme(theme);
    </script>
    <app-root></app-root>
  </body>
</html>
