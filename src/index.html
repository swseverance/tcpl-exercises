<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The C Programming Language Exercises</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><text x='50' y='80' font-size='80' font-family='Arial Black, Helvetica Neue, Helvetica, sans-serif' font-weight='900' fill='%231857a4' text-anchor='middle'>C</text></svg>"
    />
  </head>
  <body>
    <script>
      const LIGHT = 'tcpl-exercises-light-theme';
      const DARK = 'tcpl-exercises-dark-theme';

      const lightStyle = document.querySelector('link[href^="light-theme"]');
      const darkStyle = document.querySelector('link[href^="dark-theme"]');

      var themeService = {
        theme: null,
        applyLightTheme: function () {
          localStorage.setItem('theme', LIGHT);

          lightStyle.disabled = false;
          document.body.classList.add(LIGHT);

          darkStyle.disabled = true;
          document.body.classList.remove(DARK);

          this.theme = LIGHT;
        },
        applyDarkTheme: function () {
          localStorage.setItem('theme', DARK);

          lightStyle.disabled = true;
          document.body.classList.remove(LIGHT);

          darkStyle.disabled = false;
          document.body.classList.add(DARK);

          this.theme = DARK;
        },
        toggle: function () {
          this.theme === LIGHT ? this.applyDarkTheme() : this.applyLightTheme();
        }
      };

      let theme = LIGHT;

      if (
        localStorage.getItem('theme') === DARK ||
        (!localStorage.getItem('theme') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        theme = DARK;
      }

      theme === LIGHT ? themeService.applyLightTheme() : themeService.applyDarkTheme();
    </script>
    <app-root></app-root>
  </body>
</html>
