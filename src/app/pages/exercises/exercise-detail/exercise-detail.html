@let theme = theme$ | async;
@let draft = draft$ | async;
@let submissions = submissions$ | async;
@let exercise = exercise$ | async;

<div class="exercise-layout">
  <div class="editor-section">
    @if (draft && theme) {
      <app-code-editor [code]="draft.code" [theme]="theme" (codeChange)="onCodeChange($event)" />
      <button nz-button nzType="primary" type="button" (click)="onSubmit()">Submit</button>
    }
  </div>

  <div nz-row [nzGutter]="16" class="results-section">
    <div nz-col [nzSpan]="12">
      <app-test-cases [tests]="exercise?.tests ?? []" ngSkipHydration />
    </div>

    <div nz-col [nzSpan]="12">
      <app-submissions [submissions]="submissions ?? []" ngSkipHydration />
    </div>
  </div>
</div>
