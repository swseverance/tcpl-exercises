<nz-layout>
  <nz-header>
    <a routerLink="/"><strong>The C Programming Language Exercises</strong></a>

    <span class="icons">
      <button
        nz-button
        nzType="text"
        type="button"
        aria-label="Toggle light and dark theme"
        (click)="theme.toggle()"
      >
        <span
          nz-icon
          [nzType]="theme.theme() === 'light' ? 'moon' : 'sun'"
          nzTheme="outline"
        ></span>
      </button>

      <a
        nz-button
        nzType="text"
        href="https://github.com/swseverance/tcpl-exercises"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub repository"
      >
        <span nz-icon nzType="github" nzTheme="outline"></span>
      </a>
    </span>
  </nz-header>

  <nz-content>
    <router-outlet />
  </nz-content>
</nz-layout>
