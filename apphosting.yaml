# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Vercel team ID used to authenticate the Sandbox SDK with an access
  # token (this server doesn't run on Vercel, so VERCEL_OIDC_TOKEN is never
  # available). Not secret, just an identifier; same team for every
  # environment. VERCEL_PROJECT_ID and VERCEL_TOKEN are project-scoped and
  # set per environment in apphosting.local.yaml / apphosting.dev.yaml /
  # apphosting.prod.yaml instead.
  - variable: VERCEL_TEAM_ID
    value: team_0M3MOKT5ntF9hBTAuhcJCd0g
    availability:
      - RUNTIME
  # Not secret, just a hostname. Same Upstash Redis database for every
  # environment; UPSTASH_REDIS_REST_TOKEN is the actual credential and is
  # set per environment in apphosting.local.yaml / apphosting.dev.yaml /
  # apphosting.prod.yaml instead.
  - variable: UPSTASH_REDIS_REST_URL
    value: https://loyal-minnow-40926.upstash.io
    availability:
      - RUNTIME
